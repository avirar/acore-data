name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Unit + regression tests (no live DB required)
        run: .venv/bin/python -m pytest tests/test_helpers.py tests/test_regression.py -q

      - name: Registry structural audit (quality gate, no --db)
        run: .venv/bin/python scripts/audit_registry.py
